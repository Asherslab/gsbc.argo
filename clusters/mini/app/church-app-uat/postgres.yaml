# UAT's own Postgres, not shared with any other app: one database (`churchapp`), a schema per feature.
# local-path storage (no storageClassName: the k3s default applies). Backed up by Databasus (README.md).
#
# Sync wave -1: Argo waits for it to be healthy before the migrator (wave 0) and the app (wave 1).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: churchapp
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "postgres", "-d", "churchapp" ]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [ "pg_isready", "-U", "postgres", "-d", "churchapp" ]
            periodSeconds: 30
          # Room for the G-NAF import (16 million rows and their indexes, quarterly) and searches over it.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # 5Gi is nominal: local-path doesn't enforce a size, so the real limit is the VM's disk. G-NAF alone is
  # about 4.6 GB, and about 10 GB once a quarterly release has replaced the first (the old one is kept until
  # the new one finishes, and deleted rows' space is reused, not returned). Left at 5Gi deliberately: a
  # volumeClaimTemplate can't change in place, so editing it would fail every sync of this app.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
