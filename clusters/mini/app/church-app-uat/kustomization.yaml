apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: church-app-uat
resources:
  - limitrange.yaml
  - config.yaml
  - postgres.yaml
  - migrator.yaml
  - api.yaml
  - gateway.yaml
  - ingress.yaml
  - tunnel-bindings.yaml
images:
  # The `#image` markers are load-bearing: GSBC.ChurchApp's uat-backend workflow rewrites all three lines by
  # matching them, and fails unless it finds exactly three. All three images are built from one commit.
  - name: ghcr.io/asherslab/gsbc-churchapp-api
    newTag: sha-b9c09f17488ad172ce23f9450d23914c6fbff3d4 #image
  - name: ghcr.io/asherslab/gsbc-churchapp-gateway
    newTag: sha-b9c09f17488ad172ce23f9450d23914c6fbff3d4 #image
  - name: ghcr.io/asherslab/gsbc-churchapp-migrator
    newTag: sha-b9c09f17488ad172ce23f9450d23914c6fbff3d4 #image
