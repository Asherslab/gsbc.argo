apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: church-app-uat
resources:
  - limitrange.yaml
  - config.yaml
  - postgres.yaml
  - migrator.yaml
  - api.yaml
  - gateway.yaml
  - website.yaml
  - ingress.yaml
  - tunnel-bindings.yaml
images:
  # The `#image` markers are load-bearing: GSBC.ChurchApp's uat-backend workflow rewrites all four lines by
  # matching them, and fails unless it finds exactly four. All four images are built from one commit.
  - name: ghcr.io/asherslab/gsbc-churchapp-api
    newTag: sha-65d50e773334aac748887e938abe240e982e20c5 #image
  - name: ghcr.io/asherslab/gsbc-churchapp-gateway
    newTag: sha-65d50e773334aac748887e938abe240e982e20c5 #image
  - name: ghcr.io/asherslab/gsbc-churchapp-migrator
    newTag: sha-65d50e773334aac748887e938abe240e982e20c5 #image
  - name: ghcr.io/asherslab/gsbc-churchapp-website
    newTag: sha-65d50e773334aac748887e938abe240e982e20c5 #image
