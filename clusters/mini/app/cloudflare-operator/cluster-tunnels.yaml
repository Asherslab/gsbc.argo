# Tunnel names are deliberately NOT adp-tunnel / baptist-tunnel.
#
# Those names belong to the live OCI cluster. Creating tunnels with the same
# names from a second cluster, or binding the same FQDNs, would repoint the
# production DNS records at this (initially empty) cluster. Distinct names mean
# both clusters can run simultaneously and cutover is a deliberate DNS flip.
apiVersion: networking.cfargotunnel.com/v1alpha2
kind: ClusterTunnel
metadata:
  name: adp-tunnel-mini
spec:
  newTunnel:
    name: adp-tunnel-mini
  cloudflare:
    email: asher.parry@icloud.com
    domain: adp.au
    secret: cloudflare-secrets
    accountId: 2dc92eef3e5a66a41a3a56dbf8d68e8b
  deployPatch: |
    spec:
      template:
        spec:
          containers:
            - name: cloudflared
              image: docker.io/cloudflare/cloudflared:latest
---
apiVersion: networking.cfargotunnel.com/v1alpha2
kind: ClusterTunnel
metadata:
  name: baptist-tunnel-mini
spec:
  newTunnel:
    name: baptist-tunnel-mini
  cloudflare:
    email: asher.parry@icloud.com
    domain: baptist.com.au
    secret: cloudflare-secrets
    accountId: fd367422b3ed5d701cedfa81dd3e0ec8
  deployPatch: |
    spec:
      template:
        spec:
          containers:
            - name: cloudflared
              image: docker.io/cloudflare/cloudflared:latest
