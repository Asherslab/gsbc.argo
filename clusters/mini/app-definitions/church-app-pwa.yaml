# Church app PWA preview (Asherslab/GSBC.ChurchApp, spikes/app-poc). Short-lived: staff try the design for
# a couple of weeks before TestFlight; delete this and clusters/mini/app/church-app-pwa/ after that. One
# stateless nginx pod; no database, no secrets, no chart. GSBC.ChurchApp's CI rewrites the image tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: church-app-pwa
  namespace: argo-cd
spec:
  project: default
  destination:
    namespace: church-app-pwa
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/Asherslab/gsbc.argo
    path: clusters/mini/app/church-app-pwa
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
