apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-operator
  namespace: argo-cd
spec:
  project: default
  destination:
    namespace: cloudflare-operator-system
    server: https://kubernetes.default.svc
  sources:
    # Shared kustomize base — identical to the OCI cluster.
    - path: apps/cloudflare-operator/
      repoURL: https://github.com/Asherslab/gsbc.argo
      targetRevision: HEAD
    # Cluster-specific ClusterTunnels (distinct tunnel names, see the manifest).
    - repoURL: https://github.com/Asherslab/gsbc.argo
      path: clusters/mini/app/cloudflare-operator
      targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
