apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metabase
  namespace: argo-cd
spec:
  project: default
  destination:
    namespace: metabase
    server: https://kubernetes.default.svc
  sources:
    - chart: metabase
      repoURL: https://asherslab.github.io/metabase-helm-charts
      targetRevision: '2.26.1'
      helm:
        valueFiles:
          - $values/apps/metabase/values.yaml
          - $values/clusters/mini/values/metabase.yaml
    - repoURL: https://github.com/Asherslab/gsbc.argo
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/Asherslab/gsbc.argo
      path: clusters/mini/app/metabase
      targetRevision: HEAD
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
