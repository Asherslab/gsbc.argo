apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databasus
  namespace: argo-cd
spec:
  project: default
  destination:
    namespace: databasus
    server: https://kubernetes.default.svc
  sources:
    - chart: databasus
      repoURL: oci://ghcr.io/databasus/charts/databasus
      targetRevision: latest
      helm:
        valueFiles:
          - "$values/apps/databasus/values.yaml"
    - repoURL: https://github.com/Asherslab/gsbc.argo
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true